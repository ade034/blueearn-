<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLUEEARN - Login</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #071b35;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}
.container {
    background: #102b4c;
    padding: 30px;
    border-radius: 15px;
    width: 85%;
    max-width: 380px;
    text-align: center;
}
h1 { color: #20c9ff; }
input {
    width: 100%;
    padding: 13px;
    margin: 10px 0;
    border: none;
    border-radius: 7px;
    box-sizing: border-box;
}
button {
    width: 100%;
    padding: 14px;
    background: #20c9ff;
    border: none;
    border-radius: 7px;
    font-weight: bold;
}
a { color: #20c9ff; }
#message { margin-top: 12px; }
</style>
</head>

<body>
<div class="container">
<h1>BLUEEARN</h1>
<h2>Welcome Back</h2>

<form id="loginForm">
<input id="email" type="email" placeholder="Email Address" required>
<input id="password" type="password" placeholder="Password" required>
<button id="loginButton" type="submit">LOGIN</button>
</form>

<p id="message"></p>

<p>Don't have an account? <a href="signup.html">Sign Up</a></p>
<a href="index.html">Back to Home</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCqF-TTW8TKg4PxZ8UxS3if6yCI37gbwFA",
  authDomain: "blueearn-16630.firebaseapp.com",
  projectId: "blueearn-16630",
  storageBucket: "blueearn-16630.firebasestorage.app",
  messagingSenderId: "1094531758622",
  appId: "1:1094531758622:web:7bafbeff32214e0d1a0c0f",
  measurementId: "G-MY6FMQZYDX"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    button.disabled = true;
    message.textContent = "Logging in...";

    try {
        await auth.signInWithEmailAndPassword(email, password);
        message.textContent = "Login successful!";
        window.location.href = "dashboard.html";
    } catch (error) {
        message.textContent = "Login failed: " + error.message;
        button.disabled = false;
    }
});
</script>

</body>
</html>
